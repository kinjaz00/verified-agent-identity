name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Menambahkan environment variable agar runner dipaksa pakai Node 24 (opsional tapi disarankan)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Mengubah ke versi 22 (LTS terbaru) atau 24 agar selaras dengan runner
          node-version: "22" 
          cache: 'npm' # Menambahkan cache agar install lebih cepat di kemudian hari

      - name: Install ClawHub
        run: npm install -g clawhub

      - name: Install Verified Agent Identity
        run: clawhub install verified-agent-identity

      - name: Install dependencies
        # Menggunakan 'working-directory' lebih rapi daripada 'cd scripts'
        run: npm install
        working-directory: ./scripts

      - name: Create Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge '{"name":"kinjaz00","description":"kinjaz00 AI Agent"}'
